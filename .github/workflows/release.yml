name: Release Zonely

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  package:
    name: Package ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Run tests
        run: swift test

      - name: Package app
        run: ./scripts/package-app.sh "$RELEASE_TAG"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: Zonely-${{ matrix.architecture }}
          path: |
            build/*.zip
            build/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Read release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$RELEASE_TAG" \
            --jq '.content' | base64 --decode > CHANGELOG_FOR_RELEASE.md

          awk -v tag="$RELEASE_TAG" '
            {
              header = "## " tag
              if (index($0, header) == 1 && ($0 == header || substr($0, length(header) + 1, 3) == " - ")) {
                found = 1
                next
              }
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG_FOR_RELEASE.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No release notes found for $RELEASE_TAG in CHANGELOG.md" >&2
            exit 1
          fi

          cat RELEASE_NOTES.md

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Zonely $RELEASE_TAG" \
            --latest \
            --notes-file RELEASE_NOTES.md \
            release-assets/*
