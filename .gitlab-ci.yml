workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - package
  - release

.macos_job:
  tags:
    - saas-macos-medium-m1
  image: macos-26-xcode-26
  before_script:
    - swift --version
    - xcodebuild -version

run-tests:
  extends: .macos_job
  stage: test
  script:
    - swift test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

package-app:
  extends: .macos_job
  stage: package
  needs:
    - job: run-tests
  script:
    - ./scripts/package-app.sh "${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
  artifacts:
    name: "Zonely-${CI_COMMIT_REF_SLUG}"
    paths:
      - build/*.zip
      - build/*.sha256
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

create-release:
  image: registry.gitlab.com/gitlab-org/cli:latest
  stage: release
  needs:
    - job: package-app
      artifacts: true
  script:
    - test -f "build/Zonely-${CI_COMMIT_TAG}-macos-arm64.zip"
    - test -f "build/Zonely-${CI_COMMIT_TAG}-macos-arm64.zip.sha256"
  artifacts:
    name: "Zonely-${CI_COMMIT_TAG}"
    paths:
      - build/Zonely-${CI_COMMIT_TAG}-macos-arm64.zip
      - build/Zonely-${CI_COMMIT_TAG}-macos-arm64.zip.sha256
    expire_in: never
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Zonely $CI_COMMIT_TAG'
    description: 'Automated macOS build for Zonely $CI_COMMIT_TAG.'
    assets:
      links:
        - name: 'Zonely for Apple Silicon'
          url: '${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/build/Zonely-${CI_COMMIT_TAG}-macos-arm64.zip'
          filepath: '/Zonely-${CI_COMMIT_TAG}-macos-arm64.zip'
          link_type: package
        - name: 'SHA-256 checksum'
          url: '${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/build/Zonely-${CI_COMMIT_TAG}-macos-arm64.zip.sha256'
          filepath: '/Zonely-${CI_COMMIT_TAG}-macos-arm64.zip.sha256'
          link_type: other
  rules:
    - if: '$CI_COMMIT_TAG'
